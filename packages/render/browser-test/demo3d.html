<!doctype html>
<meta charset="utf-8">
<title>3D render demo</title>
<body style="margin:0;background:#000;overflow:hidden">
<script type="module">
import { Camera3D, DrawList3D, createBox, createPlane, createSphere, createCylinder, createCapsule, createLighting, createRenderer3D } from '../src/index.js';

const params = new URLSearchParams(location.search);
const renderer = await createRenderer3D({ prefer: params.get('renderer') ? [params.get('renderer')] : undefined, antialias: params.get('aa') !== '0' });
document.body.append(renderer.canvas);
const W = Number(params.get('w') ?? innerWidth), H = Number(params.get('h') ?? innerHeight);
renderer.resize(W, H, devicePixelRatio);
const camera = new Camera3D({ x: 0, y: 1.5, z: 6, pitch: -0.15, fovY: 1.0, viewW: W, viewH: H, far: 300 });
const list = new DrawList3D();
const box = createBox(1, 1, 1), sphere = createSphere(0.6, 32, 20), plane = createPlane(60, 60, 1, 1), cylinder = createCylinder(0.4, 1.2, 24), capsule = createCapsule(0.35, 1.6, 20, 8);
const L = { ...createLighting(), fogDensity: 0.012 };
function scene(t) {
  list.clear();
  list.addTransform(plane, 0, 0, 0, null, 1, 1, 1, 0.45, 0.5, 0.42);
  list.addTransform(box, -1.5, 0.5, 0, null, 1, 1, 1, 0.9, 0.1, 0.1);
  list.addTransform(sphere, 1.5, 0.6, 0, null, 1, 1, 1, 0.1, 0.8, 0.2);
  list.addTransform(cylinder, 3.5, 0.6, -2, null, 1, 1, 1, 0.8, 0.8, 0.2);
  list.addTransform(capsule, -3.5, 0.8, -2, null, 1, 1, 1, 0.7, 0.2, 0.7);
  for (let i = 0; i < 60; i++) list.addTransform(box, ((i % 10) - 4.5) * 3, 0.5 + (i % 3) * 0.5, -6 - ((i / 10) | 0) * 4, null, 1, 1 + (i % 3), 1, (i % 7) / 7, 0.3 + (i % 5) / 8, 0.9 - (i % 4) / 5);
}
scene(0);
function frame(now) {
  camera.x = Math.sin(now / 2500) * 2; camera.yaw = -camera.x * 0.05;
  renderer.render({ camera, list, clear: [0.62, 0.7, 0.8, 1], lighting: L });
  if (!params.get('still')) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__demo = { renderer, camera, kind: renderer.kind };
</script>
