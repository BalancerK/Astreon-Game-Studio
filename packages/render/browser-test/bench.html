<!doctype html>
<meta charset="utf-8">
<title>Render benchmark</title>
<body style="margin:0;background:#000">
<script type="module">
import { Atlas, Camera, SpriteBatch, createRenderer, packTint, sortKey } from '../src/index.js';

const params = new URLSearchParams(location.search);
const W = Number(params.get('w') ?? 1280), H = Number(params.get('h') ?? 720);
const quick = params.get('quick') === '1';
const kinds = (params.get('kinds') ?? 'canvas2d,webgl2,webgpu').split(',');
const FRAMES = quick ? 40 : 150, WARMUP = quick ? 10 : 40;
const MAX_MS_PER_CONFIG = quick ? 1500 : 4000;

const atlas = new Atlas({ size: 256 });
const circle = atlas.add('circle', 64, 64, (g, x, y, w) => { g.fillStyle = '#fff'; g.beginPath(); g.arc(x + w / 2, y + w / 2, w / 2 - 1, 0, Math.PI * 2); g.fill(); });
const square = atlas.add('square', 16, 16, (g, x, y, w, h) => { g.fillStyle = '#fff'; g.fillRect(x, y, w, h); });

let seed = 12345;
const rand = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);

function fill(batch, n, { minSize, maxSize, keyed }) {
  batch.clear();
  for (let i = 0; i < n; i++) {
    const s = minSize + rand() * (maxSize - minSize);
    batch.push(rand() * W, rand() * H, s, s, rand() * 6.28, rand() < 0.5 ? circle : square, packTint(60 + rand() * 195, 60 + rand() * 195, 60 + rand() * 195, 180 + rand() * 75), keyed ? rand() * 1000 : 0);
  }
}

const pct = (sorted, p) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))];
const stats = (a) => { const s = [...a].sort((x, y) => x - y); return { median: pct(s, 0.5), p95: pct(s, 0.95), mean: a.reduce((x, y) => x + y, 0) / a.length, min: s[0] }; };

/** Wait until the GPU has actually finished the frame (otherwise we only time command submission). */
async function finish(renderer) {
  if (renderer.kind === 'webgpu') await renderer.device.queue.onSubmittedWorkDone();
  else if (renderer.kind === 'webgl2') renderer.gl.readPixels(0, 0, 1, 1, renderer.gl.RGBA, renderer.gl.UNSIGNED_BYTE, new Uint8Array(4));
  else renderer.ctx.getImageData(0, 0, 1, 1);
}

/** Frames submitted back to back with one wait at the end: the throughput the GPU can sustain, free of per-frame sync latency. */
async function throughput(renderer, batch, camera, shuffledReset) {
  let frames = 0;
  const t0 = performance.now();
  while (frames < FRAMES) {
    shuffledReset?.();
    renderer.render({ camera, batch });
    frames++;
    if (frames >= 3 && performance.now() - t0 > MAX_MS_PER_CONFIG) break; // very slow configurations: fewer frames
  }
  await finish(renderer);
  return (performance.now() - t0) / frames;
}

async function measure(renderer, batch, camera) {
  const submit = [], total = [];
  const t00 = performance.now();
  let warm = WARMUP;
  for (let f = 0; f < WARMUP + FRAMES; f++) {
    const t0 = performance.now();
    renderer.render({ camera, batch });
    const t1 = performance.now();
    await finish(renderer);
    const t2 = performance.now();
    if (f === 0 && t2 - t0 > 200) warm = 1; // a very slow configuration: do not spend a minute warming up
    if (f >= warm) { submit.push(t1 - t0); total.push(t2 - t0); }
    if (f >= warm + 2 && performance.now() - t00 > MAX_MS_PER_CONFIG) break;
  }
  return { frames: total.length, submit: stats(submit), total: stats(total), pipelinedMs: await throughput(renderer, batch, camera) };
}

/** What a player would see: requestAnimationFrame cadence while rendering the same scene every frame. */
function rafRun(renderer, batch, camera, ms = quick ? 1000 : 2500) {
  return new Promise((resolve) => {
    const gaps = []; let last = 0; const start = performance.now();
    const frame = (now) => {
      if (last) gaps.push(now - last);
      last = now;
      renderer.render({ camera, batch });
      if (performance.now() - start < ms) requestAnimationFrame(frame);
      else { const g = gaps.slice(5); resolve({ fps: 1000 / (g.reduce((a, b) => a + b, 0) / g.length), worstGap: Math.max(...g), p99Gap: pct([...g].sort((a, b) => a - b), 0.99) }); }
    };
    requestAnimationFrame(frame);
  });
}

async function environment() {
  const env = { userAgent: navigator.userAgent, cores: navigator.hardwareConcurrency, dpr: devicePixelRatio, canvas: [W, H] };
  try {
    const adapter = await navigator.gpu?.requestAdapter();
    const info = adapter?.info ?? (await adapter?.requestAdapterInfo?.());
    env.webgpu = adapter ? { vendor: info?.vendor, architecture: info?.architecture, device: info?.device, description: info?.description, isFallback: adapter.isFallbackAdapter ?? info?.isFallbackAdapter } : null;
  } catch (e) { env.webgpu = `error: ${e.message}`; }
  try {
    const gl = document.createElement('canvas').getContext('webgl2');
    const ext = gl?.getExtension('WEBGL_debug_renderer_info');
    env.webgl2 = gl ? { vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR), renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER) } : null;
  } catch (e) { env.webgl2 = `error: ${e.message}`; }
  return env;
}

const scenarios = [
  // many small sprites: vertex/instance bound
  ...[1000, 10_000, 50_000, 100_000, 200_000].map((n) => ({ name: 'small', n, minSize: 12, maxSize: 24, keyed: false })),
  // big overlapping sprites: fill-rate bound
  ...[500, 2000, 8000].map((n) => ({ name: 'large (overdraw)', n, minSize: 200, maxSize: 320, keyed: false })),
  // the sort: same scene with random sort keys, so the batch has to be sorted every frame
  { name: 'small, sorted each frame', n: 50_000, minSize: 12, maxSize: 24, keyed: true, resortEachFrame: true },
];

const out = { env: await environment(), width: W, height: H, results: [], cpu: [], init: {} };

// CPU costs that do not depend on the backend: filling the batch, and sorting it
for (const n of [10_000, 50_000, 200_000]) {
  const b = new SpriteBatch(n);
  const reps = quick ? 5 : 15;
  const fillT = [], sortT = [];
  for (let r = 0; r < reps + 2; r++) {
    let t0 = performance.now(); fill(b, n, { minSize: 12, maxSize: 24, keyed: true }); const f = performance.now() - t0;
    t0 = performance.now(); b.sort(); const s = performance.now() - t0;
    if (r >= 2) { fillT.push(f); sortT.push(s); }
  }
  out.cpu.push({ n, fillMs: stats(fillT).median, sortMs: stats(sortT).median });
}

for (const kind of kinds) {
  let renderer;
  const tInit = performance.now();
  try {
    renderer = await createRenderer({ atlas, prefer: [kind] });
    if (renderer.kind !== kind) throw new Error(`got ${renderer.kind}`);
  } catch (e) { out.results.push({ kind, unavailable: String(e.message ?? e) }); continue; }
  document.body.append(renderer.canvas);
  renderer.resize(W, H, 1);
  const camera = new Camera({ x: W / 2, y: H / 2, zoom: 1, viewW: W, viewH: H });
  { const b = new SpriteBatch(16); fill(b, 16, { minSize: 12, maxSize: 24, keyed: false }); renderer.render({ camera, batch: b }); await finish(renderer); out.init = { ...out.init, [kind]: performance.now() - tInit }; } // create + first frame on screen
  for (const sc of scenarios) {
    if (kind === 'canvas2d' && (sc.n > 20_000 || (sc.name.startsWith('large') && sc.n > 500))) continue; // hopeless and slow to wait for; the point is made at 10k small / 500 large sprites
    const batch = new SpriteBatch(sc.n);
    fill(batch, sc.n, sc);
    // for the sort scenario, restore the shuffled order each frame so sort() has real work every time
    let m;
    if (sc.resortEachFrame) {
      const shuffled = new SpriteBatch(sc.n);
      fill(shuffled, sc.n, sc);
      const orig = { f32: shuffled.f32.slice(), keys: shuffled.keys.slice() };
      const submit = [], total = [];
      for (let f = 0; f < WARMUP + FRAMES; f++) {
        shuffled.f32.set(orig.f32); shuffled.keys.set(orig.keys); shuffled.count = sc.n; shuffled.needsSort = true;
        const t0 = performance.now();
        renderer.render({ camera, batch: shuffled });
        const t1 = performance.now();
        await finish(renderer);
        const t2 = performance.now();
        if (f >= WARMUP) { submit.push(t1 - t0); total.push(t2 - t0); }
      }
      const reset = () => { shuffled.f32.set(orig.f32); shuffled.keys.set(orig.keys); shuffled.count = sc.n; shuffled.needsSort = true; };
      m = { frames: total.length, submit: stats(submit), total: stats(total), pipelinedMs: await throughput(renderer, shuffled, camera, reset) };
    } else {
      m = await measure(renderer, batch, camera);
    }
    const row = { kind, scenario: sc.name, n: sc.n, ...m };
    if ((sc.name === 'small' && (sc.n === 10_000 || sc.n === 50_000)) || (sc.name.startsWith('large') && sc.n === 2000)) row.raf = await rafRun(renderer, batch, camera);
    out.results.push(row);
  }
  renderer.destroy?.();
  renderer.canvas.remove();
}
await fetch('/report', { method: 'POST', body: JSON.stringify(out) });
</script>
