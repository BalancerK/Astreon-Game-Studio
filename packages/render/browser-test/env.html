<!doctype html>
<meta charset="utf-8">
<title>Environment lighting self-test</title>
<body style="margin:0;background:#000">
<script type="module">
const fail = (m) => fetch('/report', { method: 'POST', body: JSON.stringify({ results: [], error: String(m) }) });
window.addEventListener('error', (e) => fail(`${e.message} at ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => fail(e.reason?.stack ?? e.reason));
import {
  createRenderer3D, Camera3D, DrawList3D, createLighting, createSphere, MaterialSet, TextureSet, buildEnvironment, skyEnvironment, uniformEnvironment, sampleEnvironment,
  rotateForEnvironment, pbrLight, pbrAmbientEnvironment, srgbToLinear, linearToSrgb,
} from '../src/index.js';

const W = 320, H = 240;
const CLEAR = [0.12, 0.14, 0.2, 1];
const clearBytes = CLEAR.slice(0, 3).map((v) => Math.round(v * 255));
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = (v) => { const l = Math.hypot(...v) || 1; return v.map((x) => x / l); };
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const bytes = (linear) => linear.map((c) => Math.round(255 * Math.max(0, Math.min(1, linearToSrgb(c)))));
const worst = (a, b) => Math.max(...a.map((v, i) => Math.abs(v - b[i])));

/** What a point of a surface must look like: the sun, and the environment (its diffuse light and its reflection), written out on the CPU. */
function expected(s, n, p, cam, sun, env, settings) {
  const v = norm([cam.x - p[0], cam.y - p[1], cam.z - p[2]]);
  const amb = pbrAmbientEnvironment(s, n, v, env, settings);
  const direct = pbrLight(s, n, v, norm(sun.direction), sun.color);
  return bytes([0, 1, 2].map((k) => amb.diffuse[k] + amb.specular[k] + direct.diffuse[k] + direct.specular[k]));
}

function read(renderer) {
  const c = document.createElement('canvas');
  c.width = renderer.canvas.width; c.height = renderer.canvas.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(renderer.canvas, 0, 0);
  const img = g.getImageData(0, 0, c.width, c.height);
  return { canvas: c, px: (x, y) => [...img.data.slice((y * c.width + x) * 4, (y * c.width + x) * 4 + 3)] };
}
const sphere = createSphere(0.5, 64, 40);

// a cube whose six faces are six different colours, to see which way the GPU's cube faces point
const faceColours = [[0.9, 0.1, 0.1], [0.1, 0.8, 0.8], [0.1, 0.8, 0.1], [0.8, 0.1, 0.8], [0.1, 0.1, 0.9], [0.9, 0.8, 0.1]];
const sixColours = buildEnvironment(faceColours.map((c) => Float32Array.from({ length: 16 * 16 * 3 }, (_, i) => c[i % 3])), 16);

async function check(kind) {
  const out = { kind, checks: {} };
  const add = (name, ok, got, want) => { out.checks[name] = { ok, got, want }; };
  try {
    const renderer = await createRenderer3D({ prefer: [kind], antialias: false });
    if (renderer.kind !== kind) throw new Error(`got ${renderer.kind}`);
    document.body.append(renderer.canvas);
    renderer.resize(W, H, 1);
    const textures = new TextureSet({ size: 16, maxLayers: 2 });
    const materials = new MaterialSet();
    renderer.setTextures(textures);
    renderer.setMaterials(materials);
    const sun = { direction: [0.4, 0.7, 0.6], color: [0.6, 0.56, 0.5] };
    const L = { ...createLighting(), direction: sun.direction, color: sun.color, pointLights: [], fogDensity: 0 };
    const list = new DrawList3D();
    const cam = new Camera3D({ x: 0, y: 0, z: 8, fovY: 0.7, viewW: W, viewH: H });
    const draw = (camera = cam, lighting = L) => { camera.update(); renderer.render({ camera, list, clear: CLEAR, lighting }); return read(renderer); };
    const sphereAt = (camera, c, sx, sy) => {
      const { origin, dir } = camera.screenToRay(sx + 0.5, sy + 0.5);
      const oc = sub(origin, c), b = dot(oc, dir), cc = dot(oc, oc) - 0.25, disc = b * b - cc;
      if (disc < 0) return null;
      const t = -b - Math.sqrt(disc), p = [origin[0] + dir[0] * t, origin[1] + dir[1] * t, origin[2] + dir[2] * t];
      return { p, n: norm(sub(p, c)) };
    };

    // ---- 1. a white environment lights a white matte surface to its own colour from every side ----
    const white = uniformEnvironment([1, 1, 1], 16);
    renderer.setEnvironment(white);
    const matte = materials.add({ baseColor: [0.5, 0.5, 0.5, 1], metallic: 0, roughness: 1 });
    list.clear(); list.setSurface(matte); list.addTransform(sphere, 0, 0, 0, null, 1, 1, 1); list.setSurface(0);
    const noSun = { ...L, color: [0, 0, 0] };
    let img = draw(cam, noSun);
    const centre = img.px(Math.round(cam.worldToScreen(0, 0, 0).x), Math.round(cam.worldToScreen(0, 0, 0).y));
    const wantWhite = expected({ baseColor: [0.5, 0.5, 0.5], metallic: 0, roughness: 1 }, [0, 0, 1], [0, 0, 0.5], cam, { direction: [0, 1, 0], color: [0, 0, 0] }, white);
    add('a white environment: a grey matte sphere shows its own colour (plus a little reflection), the same from every side', worst(centre, wantWhite) <= 3, [centre, wantWhite], 'within 3/255');
    const sky1 = img.px(5, 5);
    add('and the sky behind it is that white environment', worst(sky1, [255, 255, 255]) <= 2, sky1, [255, 255, 255]);

    // ---- 2. a sky with a sun: spheres from mirror to chalk, lit and reflecting it ----
    const env = skyEnvironment({ sun: { direction: [0.5, 0.45, 0.75], intensity: 25, size: 0.06 } });
    renderer.setEnvironment(env);
    const gold = [1.0, 0.77, 0.34];
    const rows = [];
    for (const [metal, rough] of [[1, 0.05], [1, 0.3], [1, 0.6], [1, 1], [0, 0.3]]) rows.push({ metal, rough, id: materials.add({ baseColor: [...gold, 1], metallic: metal, roughness: rough }) });
    list.clear();
    const centres = rows.map((r, i) => [(i - 2) * 1.15, 0, 0]);
    rows.forEach((r, i) => { list.setSurface(r.id); list.addTransform(sphere, ...centres[i], null, 1, 1, 1); });
    list.setSurface(0);
    const settings = { intensity: 1, rotation: 0 };
    img = draw(cam, { ...L, environment: settings });
    let maxErr = 0, where = '', n = 0;
    for (const [i, r] of rows.entries()) {
      const proj = cam.worldToScreen(...centres[i]), rpx = cam.worldToScreen(centres[i][0] + 0.5, 0, 0).x - proj.x;
      for (const [dx, dy] of [[0, 0], [-0.5, -0.55], [0.55, 0.4], [0.1, 0.7], [-0.6, 0.35]]) {
        const sx = Math.round(proj.x + dx * rpx), sy = Math.round(proj.y + dy * rpx), hitp = sphereAt(cam, centres[i], sx, sy);
        if (!hitp) continue;
        const want = expected({ baseColor: gold, metallic: r.metal, roughness: r.rough }, hitp.n, hitp.p, cam, sun, env, settings);
        const got = img.px(sx, sy), err = worst(got, want);
        n++;
        if (err > maxErr) { maxErr = err; where = `sphere ${i} (${dx}, ${dy}): got ${got} want ${want}`; }
      }
    }
    add('a sky with a sun: 25 pixels on five spheres match the shading model (sun, soft sky light, reflections)', n === 25 && maxErr <= 12, [n, maxErr, where], 'within 12/255');
    // the smoother the metal, the sharper it mirrors the sun; the rough one only glows
    const brightest = (i) => { const pr = cam.worldToScreen(...centres[i]); let best = 0; for (let y = Math.round(pr.y - 25); y <= Math.round(pr.y + 25); y++) for (let x = Math.round(pr.x - 25); x <= Math.round(pr.x + 25); x++) best = Math.max(best, ...img.px(x, y)); return best; };
    add('a mirror-smooth metal shows the sun brighter than a rough one', brightest(0) >= brightest(3), [brightest(0), brightest(3)], 'smooth >= rough');

    // ---- 3. the sky is drawn as the background ----
    const sky = (camera, sx, sy, settingsNow = settings) => {
      const dir = camera.screenToRay(sx + 0.5, sy + 0.5).dir;
      return bytes(sampleEnvironment(env, rotateForEnvironment(dir, settingsNow.rotation), 0).map((v) => v * settingsNow.intensity));
    };
    let bgErr = 0, bgWhere = '';
    for (const [sx, sy] of [[4, 4], [160, 6], [315, 6], [10, 120], [310, 230], [160, 236]]) {
      const got = img.px(sx, sy), want = sky(cam, sx, sy);
      const err = worst(got, want);
      if (err > bgErr) { bgErr = err; bgWhere = `(${sx}, ${sy}): got ${got} want ${want}`; }
    }
    add('the sky behind the scene shows the environment, pixel by pixel', bgErr <= 6, [bgErr, bgWhere], 'within 6/255');

    // ---- 4. which way the cube's faces point: six coloured faces, six directions ----
    renderer.setEnvironment(sixColours);
    list.clear();
    const looks = [[0, 0], [Math.PI / 2, 0], [Math.PI, 0], [-Math.PI / 2, 0], [0, 1.5], [0, -1.5]];
    let faceErr = 0, faceWhere = '';
    for (const [yaw, pitch] of looks) {
      const c = new Camera3D({ x: 0, y: 0, z: 0, yaw, pitch, fovY: 0.4, viewW: W, viewH: H });
      const image = draw(c, { ...L, environment: { intensity: 1, rotation: 0 } });
      const want = bytes(sampleEnvironment(sixColours, c.forward(), 0));
      const got = image.px(W / 2, H / 2), err = worst(got, want);
      if (err > faceErr) { faceErr = err; faceWhere = `yaw ${yaw} pitch ${pitch}: got ${got} want ${want}`; }
    }
    add('the six faces of the cube are where the CPU says they are (looking along each axis)', faceErr <= 4, [faceErr, faceWhere], 'within 4/255');

    // ---- 5. rotation, intensity, sky off, environment off ----
    renderer.setEnvironment(env);
    list.clear();
    const spin = { intensity: 1, rotation: 1.1 };
    img = draw(cam, { ...L, environment: spin });
    let rotErr = 0, rotWhere = '';
    for (const [sx, sy] of [[4, 4], [160, 6], [315, 100], [10, 220]]) {
      const got = img.px(sx, sy), want = sky(cam, sx, sy, spin), err = worst(got, want);
      if (err > rotErr) { rotErr = err; rotWhere = `(${sx}, ${sy}): got ${got} want ${want}`; }
    }
    add('turning the environment turns the sky the way rotateForEnvironment says', rotErr <= 8, [rotErr, rotWhere], 'within 8/255');
    list.clear(); list.setSurface(rows[1].id); list.addTransform(sphere, 0, 0, 0, null, 1, 1, 1); list.setSurface(0);
    const turned = draw(cam, { ...L, environment: spin });
    const proj0 = cam.worldToScreen(0, 0, 0), rpx0 = cam.worldToScreen(0.5, 0, 0).x - proj0.x;
    let sErr = 0, sWhere = '';
    for (const [dx, dy] of [[0, 0], [-0.5, -0.5], [0.5, 0.3], [0.1, 0.65]]) {
      const sx = Math.round(proj0.x + dx * rpx0), sy = Math.round(proj0.y + dy * rpx0), hitp = sphereAt(cam, [0, 0, 0], sx, sy);
      if (!hitp) continue;
      const want = expected({ baseColor: gold, metallic: 1, roughness: 0.3 }, hitp.n, hitp.p, cam, sun, env, spin), got = turned.px(sx, sy), err = worst(got, want);
      if (err > sErr) { sErr = err; sWhere = `got ${got} want ${want}`; }
    }
    add('a turned environment is reflected and lights surfaces from its new direction', sErr <= 12, [sErr, sWhere], 'within 12/255');
    const bright = draw(cam, { ...L, environment: { intensity: 0.5, rotation: 0 } });
    const half = bright.px(160, 6), full = sky(cam, 160, 6, { intensity: 1, rotation: 0 });
    add('intensity scales the environment', worst(half, bytes(sampleEnvironment(env, cam.screenToRay(160.5, 6.5).dir, 0).map((v) => v * 0.5))) <= 6 && worst(half, full) > 15, [half, full], 'half as bright');
    const noSky = draw(cam, { ...L, environment: { sky: false } });
    add('sky: false keeps the lighting and leaves the background to the clear colour', worst(noSky.px(160, 6), clearBytes) <= 2 && worst(noSky.px(160, 120), noSky.px(160, 120)) === 0, noSky.px(160, 6), clearBytes);
    const off = draw(cam, { ...L, environment: false });
    add('environment: false draws no sky and no environment light', worst(off.px(160, 6), clearBytes) <= 2 && worst(off.px(160, 120), turned.px(160, 120)) > 8, [off.px(160, 6), off.px(160, 120), turned.px(160, 120)], 'clear colour');
    const blur = draw(cam, { ...L, environment: { skyBlur: 1 } });
    const blurWant = bytes(sampleEnvironment(env, cam.screenToRay(160.5, 6.5).dir, env.maxLod));
    add('skyBlur shows a blurrier sky', worst(blur.px(160, 6), blurWant) <= 8, [blur.px(160, 6), blurWant], 'within 8/255');

    // ---- 6. things that are not physically based are lit as before; taking the environment away takes it all away ----
    list.clear();
    list.addTransform(sphere, 0, 0, 0, null, 1, 1, 1, 0.8, 0.2, 0.2);
    renderer.setEnvironment(null);
    const without = draw(cam, L);
    renderer.setEnvironment(env);
    const withEnv = draw(cam, { ...L, environment: { sky: false } });
    const pp = cam.worldToScreen(0, 0, 0.5);
    add('a surface with the simple lighting looks the same with and without an environment', worst(without.px(Math.round(pp.x), Math.round(pp.y)), withEnv.px(Math.round(pp.x), Math.round(pp.y))) <= 1,
      [without.px(Math.round(pp.x), Math.round(pp.y)), withEnv.px(Math.round(pp.x), Math.round(pp.y))], 'identical');
    add('with no environment the background is the clear colour', worst(without.px(160, 6), clearBytes) <= 2, without.px(160, 6), clearBytes);

    // ---- the standard scene, subsampled, so the two backends can be compared ----
    list.clear();
    rows.forEach((r, i) => { list.setSurface(r.id); list.addTransform(sphere, ...centres[i], null, 1, 1, 1); });
    list.setSurface(0);
    img = draw(cam, { ...L, environment: { rotation: 0.4 } });
    out.samples = [];
    for (let y = 2; y < H; y += 8) for (let x = 2; x < W; x += 8) out.samples.push(...img.px(x, y));
    out.image = img.canvas.toDataURL('image/png');
    out.lastError = renderer.lastError ?? '';
    out.ok = Object.values(out.checks).every((c) => c.ok) && !out.lastError;
    renderer.destroy?.();
  } catch (e) {
    out.unavailable = String(e.message ?? e);
    out.stack = String(e.stack ?? '');
  }
  return out;
}

const results = [];
for (const kind of ['webgpu', 'webgl2']) results.push(await check(kind));
await fetch('/report', { method: 'POST', body: JSON.stringify({ results, userAgent: navigator.userAgent }) });
</script>
