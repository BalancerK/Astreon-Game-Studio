<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio spike</title>
<style>
  :root { --bg: #0d1017; --panel: #12151d; --line: #232838; --fg: #d7dcea; --dim: #8993ad; --accent: #8b8bff; --good: #4ade80; --bad: #f87171; --warn: #fbbf24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 44px 1fr 150px; grid-template-columns: 1fr 520px; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header b { letter-spacing: -.01em; }
  #status { padding: 2px 10px; border-radius: 99px; font-size: 12px; background: #1f2433; }
  #status.running { color: var(--good); } #status.error { color: var(--warn); } #status.stuck { color: var(--bad); }
  header .dim { color: var(--dim); font-size: 12px; } header button { background: #1f2433; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; }
  #left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); }
  #tabs button { background: none; color: var(--dim); border: 0; border-right: 1px solid var(--line); padding: 8px 16px; cursor: pointer; font: inherit; }
  #tabs button.on { color: var(--fg); background: var(--bg); box-shadow: inset 0 -2px var(--accent); }
  #editor { flex: 1; min-height: 0; }
  #right { border-left: 1px solid var(--line); background: #000; display: flex; flex-direction: column; min-height: 0; }
  #frame { flex: 1; width: 100%; border: 0; background: #0d1017; }
  #summary { padding: 6px 12px; color: var(--dim); font: 12px ui-monospace, monospace; background: var(--panel); border-top: 1px solid var(--line); }
  #console { grid-column: 1 / 3; overflow: auto; border-top: 1px solid var(--line); background: var(--panel); padding: 8px 14px; font: 13px ui-monospace, monospace; }
  #console .row { padding: 2px 0; } #console .row.err { color: var(--bad); } #console .row.info { color: var(--dim); } #console .row.warn { color: var(--warn); }
  #console a { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <b>Studio</b><span id="status">starting</span>
  <span class="dim" id="latency"></span>
  <span style="flex:1"></span>
  <button id="restart" type="button">Restart game</button>
</header>
<div id="left"><div id="tabs"></div><div id="editor"></div></div>
<div id="right"><iframe id="frame" title="Game"></iframe><div id="summary"></div></div>
<div id="console" aria-live="polite"></div>
<script type="module" src="./studio.js"></script>
</body>
</html>
