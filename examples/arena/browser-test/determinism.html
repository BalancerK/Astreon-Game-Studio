<!doctype html>
<meta charset="utf-8">
<title>Determinism suite</title>
<script type="module">
import { runDeterminismSuite } from '../shared/determinism.js';
let body;
try {
  const t0 = performance.now();
  body = { userAgent: navigator.userAgent, ms: Math.round(performance.now() - t0), ...runDeterminismSuite() };
  body.ms = Math.round(performance.now() - t0);
} catch (e) {
  body = { error: String(e && e.stack || e) };
}
await fetch('/report', { method: 'POST', body: JSON.stringify(body) });
</script>
